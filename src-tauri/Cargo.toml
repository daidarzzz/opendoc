[package]
name = "opendoc"
version = "0.2.69"
description = "A Tauri App"
authors = ["you"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "opendoc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png`: `Image::from_bytes` con los PNG del icono por acento.
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Núcleo compartido (escaneo, índices, tarix, búsqueda y resolución de
# rutas). Se consume por etiqueta para que app y CLI compartan versión.
opendoc-core = { git = "https://github.com/daidarzzz/opendoc-core", tag = "v0.1.1" }
# Data-URL de iconos (PNG de pocos KB): crate mínima y estándar.
base64 = "0.22"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
# Gestor de docsets (F1): HTTP bloqueante (en spawn_blocking, sin runtime
# propio) con raíces webpki (sin depender del almacén del SO) y parse XML
# de feeds estilo Kapeli. Justificación AGENTS.md: cliente estándar.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
quick-xml = { version = "0.37", features = ["serialize"] }

# Icono del Dock por acento en macOS (`Window::set_icon` no existe allí):
# bindings oficiales del ecosistema (los usa Tauri por dentro).
# Justificación AGENTS.md: única vía soportada para el icono en ejecución.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = { version = "0.3", features = ["NSData", "NSGeometry"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
flate2 = "1"
tar = "0.4"


# Búsqueda en `tauri dev` (debug) sin el lastre de dependencias sin
# optimizar: medido ~700ms -> ~340ms por búsqueda a 300k entradas.
# Con el corpus real (~23k) son ~2ms; el objetivo < 50ms se cumple en
# release (37ms a 300k). Ver test large_synthetic_index_scales.
[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
