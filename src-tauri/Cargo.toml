[package]
name = "opendoc"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "opendoc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
plist = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
nucleo-matcher = "0.3.1"
# Data-URL de iconos (PNG de pocos KB): crate mínima y estándar.
base64 = "0.22"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
# Extracción tarix en producción (v0.2 adelantado a T10).
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"


# Búsqueda en `tauri dev` (debug) sin el lastre de dependencias sin
# optimizar: medido ~700ms -> ~340ms por búsqueda a 300k entradas.
# Con el corpus real (~23k) son ~2ms; el objetivo < 50ms se cumple en
# release (37ms a 300k). Ver test large_synthetic_index_scales.
[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
